# Render Blueprint — one-click deploy of the Vendtap WMS.
#
# In the Render dashboard: New → Blueprint → connect this repo. Render reads
# this file and provisions BOTH the web service and a managed Postgres
# database, wiring DATABASE_URL between them automatically.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vendtap
    runtime: node
    plan: free
    region: oregon
    # Build the React frontend, then install the API server's dependencies.
    buildCommand: cd vendtap/web && npm install && npm run build && cd ../server && npm install
    startCommand: cd vendtap/server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vendtap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: SEED_ON_START
        value: "1" # auto-load demo data on first boot (login Gluck1 / 5310)
      - key: NODE_VERSION
        value: "22"

databases:
  - name: vendtap-db
    plan: free
    region: oregon
